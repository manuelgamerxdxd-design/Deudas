<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deudas">
<title>Deudas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0b0d12;--s1:#141821;--s2:#1d2230;--line:#272d3b;
  --tx:#eceef4;--mu:#8b92a5;--acc:#7c8cff;
  --red:#ff3b4e;--org:#ff8a1f;--amb:#ffc23d;--grn:#2fd27a;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top);background:var(--bg);z-index:20}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;user-select:none;-webkit-user-select:none}
svg{width:18px;height:18px;flex:none}

header{padding:calc(env(safe-area-inset-top) + 14px) 16px 6px}
.summary{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px 18px;transition:border-color .2s}
.summary.alert{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,78,.15)}
.label{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
#total{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--s2);color:var(--mu)}
.stat.red{background:var(--red);color:#fff}
.stat.amb{background:rgba(255,194,61,.16);color:var(--amb)}
.tabs{display:flex;gap:4px;margin-top:12px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.tabs button{flex:1;padding:8px 0;border-radius:10px;font-size:14px;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--s2);color:var(--tx)}

main{display:grid;gap:10px;padding:8px 16px}
.card{background:var(--s1);border:1px solid var(--line);border-left:4px solid var(--grn);border-radius:18px;padding:14px 14px 12px}
.card.today{border-left-color:var(--org);background:rgba(255,138,31,.10)}
.card.soon{border-left-color:var(--amb);background:rgba(255,194,61,.07)}
.card.overdue{border:2px solid var(--red);background:linear-gradient(135deg,rgba(255,59,78,.32),rgba(255,59,78,.12));box-shadow:0 6px 24px rgba(255,59,78,.25)}
.card.paid{border-left-color:var(--line);opacity:.55}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-size:24px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.paid .name,.paid .amt{text-decoration:line-through;text-decoration-color:var(--mu)}
.meta{font-size:13px;color:var(--mu)}
.overdue .meta{color:#ffc2c8;font-weight:600}
.today .meta{color:var(--org)}
.soon .meta{color:var(--amb)}
.badge{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;padding:4px 8px;border-radius:7px}
.b-overdue{background:var(--red);color:#fff;animation:pulse 1.4s ease-in-out infinite}
.b-today{background:var(--org);color:#1f1000}
.b-soon{background:var(--amb);color:#1f1600}
.b-ok{background:rgba(47,210,122,.15);color:var(--grn)}
.b-paid{background:var(--s2);color:var(--mu)}
@keyframes pulse{50%{opacity:.5}}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:700;background:var(--s2);transition:transform .1s}
.btn:active{transform:scale(.96)}
.grow{flex:1}
.pay{background:var(--grn);color:#03170b}
.icon{width:42px;padding:0}
.del{color:var(--red)}
.empty{text-align:center;color:var(--mu);padding:56px 24px}
.empty b{display:block;font-size:17px;color:var(--tx);margin-bottom:4px}

.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--acc);color:#0b0d12;display:grid;place-items:center;box-shadow:0 10px 30px rgba(124,140,255,.45);z-index:10}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.94)}

dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;max-height:92dvh;overflow:auto;background:var(--s1);color:var(--tx);border-radius:24px 24px 0 0}
dialog[open]{animation:up .22s ease-out}
dialog::backdrop{background:rgba(0,0,0,.6)}
@keyframes up{from{transform:translateY(100%)}}
form{display:grid;gap:14px;padding:10px 18px calc(18px + env(safe-area-inset-bottom))}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
h2{font-size:20px}
label,.flabel{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mu)}
input:not([type=radio]){width:100%;height:50px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--acc)}
input::-webkit-date-and-time-value{text-align:left}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:block}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:13px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);font-size:15px}
.seg input:checked+span{background:var(--acc);border-color:var(--acc);color:#0b0d12}
.seg input[value=pagada]:checked+span{background:var(--grn);border-color:var(--grn);color:#03170b}
.foot{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:4px}
.foot .btn{height:52px;font-size:16px}
.primary{background:var(--acc);color:#0b0d12}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <section class="summary" id="summary">
    <span class="label">Total adeudado</span>
    <strong id="total">$ 0</strong>
    <div class="stats">
      <span class="stat" id="stOverdue"></span>
      <span class="stat" id="stSoon"></span>
      <span class="stat" id="stActive"></span>
    </div>
  </section>
  <nav class="tabs">
    <button data-f="activas" class="on">Activas</button>
    <button data-f="pagadas">Pagadas</button>
    <button data-f="todas">Todas</button>
  </nav>
</header>

<main id="list"></main>

<button class="fab" id="fab" aria-label="Agregar deuda">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<dialog id="sheet">
  <form id="form" autocomplete="off">
    <div class="grip"></div>
    <h2 id="formTitle">Nueva deuda</h2>
    <label>Acreedor o concepto
      <input name="nombre" required maxlength="60" pattern=".*\S.*" placeholder="Ej. Tarjeta Visa, Banco, Juan…">
    </label>
    <label>Monto total
      <input name="monto" type="number" inputmode="decimal" min="0.01" step="any" required placeholder="0">
    </label>
    <label>Fecha límite
      <input name="fecha" type="date" required>
    </label>
    <div class="flabel">Estado
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="estado" value="pendiente" checked><span>Pendiente</span></label>
        <label><input type="radio" name="estado" value="pagada"><span>Pagada</span></label>
      </div>
    </div>
    <div class="foot">
      <button type="button" class="btn" id="cancel">Cancelar</button>
      <button type="submit" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<script>
// ===== Configuración =====
const LOCALE = 'es-CO', MONEDA = 'COP', DECIMALES = 0;
const DIAS_ALERTA = 3;
const KEY = 'deudas.v1';

const $ = s => document.querySelector(s);
const list = $('#list'), sheet = $('#sheet'), form = $('#form');
const money = new Intl.NumberFormat(LOCALE, { style: 'currency', currency: MONEDA, minimumFractionDigits: DECIMALES, maximumFractionDigits: DECIMALES });
const fdate = new Intl.DateTimeFormat(LOCALE, { day: 'numeric', month: 'short', year: 'numeric' });

const icon = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  check: icon('<path d="M20 6 9 17l-5-5"/>'),
  undo:  icon('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'),
  edit:  icon('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  trash: icon('<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>'),
};
const BADGE = { overdue: 'VENCIDA', today: 'VENCE HOY', soon: 'PRÓXIMA', ok: 'AL DÍA', paid: 'PAGADA' };

let deudas = cargar();
let filtro = 'activas';
let editId = null;

// ===== Persistencia =====
function cargar() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d : []; }
  catch { return []; }
}
function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(deudas)); }
  catch { alert('No se pudieron guardar los datos en este navegador.'); }
}

// ===== Utilidades =====
const uid = () => crypto.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;

// Fechas en hora local: new Date('AAAA-MM-DD') se interpreta en UTC y corre el día
const aFecha = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const hoyISO = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; };
const diasHasta = iso => Math.round((aFecha(iso) - aFecha(hoyISO())) / 864e5);

function tipo(d) {
  if (d.estado === 'pagada') return 'paid';
  const n = diasHasta(d.fecha);
  return n < 0 ? 'overdue' : n === 0 ? 'today' : n <= DIAS_ALERTA ? 'soon' : 'ok';
}

function detalle(d, t) {
  const limite = fdate.format(aFecha(d.fecha));
  if (t === 'paid') return `Límite ${limite}` + (d.pagadaEn ? ` · pagada el ${fdate.format(new Date(d.pagadaEn))}` : '');
  const n = diasHasta(d.fecha);
  const rel = n < 0 ? `venció hace ${plural(-n, 'día', 'días')}`
    : n === 0 ? 'vence hoy'
    : n === 1 ? 'vence mañana'
    : `${n <= DIAS_ALERTA ? 'vence en' : 'faltan'} ${n} días`;
  return `${limite} · ${rel}`;
}

// Pendientes primero por fecha (vencidas quedan arriba); empate: mayor monto. Pagadas al final, la más reciente primero.
function ordenar(a, b) {
  const pa = a.estado === 'pagada', pb = b.estado === 'pagada';
  if (pa !== pb) return pa ? 1 : -1;
  if (pa) return (b.pagadaEn || 0) - (a.pagadaEn || 0);
  return a.fecha.localeCompare(b.fecha) || b.monto - a.monto;
}

// ===== Render =====
function render() {
  const activas = deudas.filter(d => d.estado !== 'pagada');
  const tipos = activas.map(tipo);
  const vencidas = tipos.filter(t => t === 'overdue').length;
  const proximas = tipos.filter(t => t === 'today' || t === 'soon').length;

  $('#total').textContent = money.format(activas.reduce((s, d) => s + d.monto, 0));
  $('#summary').classList.toggle('alert', vencidas > 0);
  const so = $('#stOverdue'), ss = $('#stSoon');
  so.textContent = plural(vencidas, 'vencida', 'vencidas');
  so.className = 'stat' + (vencidas ? ' red' : '');
  ss.textContent = `${proximas} por vencer`;
  ss.className = 'stat' + (proximas ? ' amb' : '');
  $('#stActive').textContent = plural(activas.length, 'activa', 'activas');

  const visibles = deudas
    .filter(d => filtro === 'todas' || (filtro === 'pagadas') === (d.estado === 'pagada'))
    .sort(ordenar);

  list.innerHTML = visibles.length ? visibles.map(card).join('') : vacio();
}

function card(d) {
  const t = tipo(d);
  const principal = t === 'paid'
    ? `<button class="btn grow" data-act="reabrir">${I.undo}Marcar pendiente</button>`
    : `<button class="btn grow pay" data-act="pagar">${I.check}Marcar pagada</button>`;
  return `<article class="card ${t}" data-id="${esc(d.id)}">
    <div class="row"><span class="name">${esc(d.nombre)}</span><span class="badge b-${t}">${BADGE[t]}</span></div>
    <div class="amt">${money.format(d.monto)}</div>
    <div class="meta">${detalle(d, t)}</div>
    <div class="acts">
      ${principal}
      <button class="btn icon" data-act="editar" aria-label="Editar">${I.edit}</button>
      <button class="btn icon del" data-act="eliminar" aria-label="Eliminar">${I.trash}</button>
    </div>
  </article>`;
}

function vacio() {
  const [t, s] = {
    activas: ['Sin deudas activas', 'Toca + para registrar una.'],
    pagadas: ['Nada pagado todavía', 'Las deudas que marques como pagadas aparecerán aquí.'],
    todas:   ['No hay deudas registradas', 'Toca + para empezar.'],
  }[filtro];
  return `<div class="empty"><b>${t}</b>${s}</div>`;
}

// ===== Formulario =====
function abrir(d) {
  editId = d ? d.id : null;
  $('#formTitle').textContent = d ? 'Editar deuda' : 'Nueva deuda';
  form.nombre.value = d ? d.nombre : '';
  form.monto.value  = d ? d.monto : '';
  form.fecha.value  = d ? d.fecha : '';
  form.estado.value = d ? d.estado : 'pendiente';
  sheet.showModal();
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const datos = {
    nombre: form.nombre.value.trim(),
    monto: Math.round(parseFloat(form.monto.value) * 100) / 100,
    fecha: form.fecha.value,
    estado: form.estado.value,
  };
  if (!datos.nombre || !(datos.monto > 0) || !datos.fecha) return;

  const d = editId && deudas.find(x => x.id === editId);
  if (d) {
    if (d.estado !== datos.estado) d.pagadaEn = datos.estado === 'pagada' ? Date.now() : null;
    Object.assign(d, datos);
  } else {
    deudas.push({ id: uid(), ...datos, creada: Date.now(), pagadaEn: datos.estado === 'pagada' ? Date.now() : null });
  }
  guardar(); sheet.close(); render();
});

$('#fab').addEventListener('click', () => abrir(null));
$('#cancel').addEventListener('click', () => sheet.close());
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

// ===== Acciones en tarjetas =====
list.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.closest('.card').dataset.id;
  const d = deudas.find(x => x.id === id);
  if (!d) return;

  switch (btn.dataset.act) {
    case 'pagar':   d.estado = 'pagada'; d.pagadaEn = Date.now(); navigator.vibrate?.(15); break;
    case 'reabrir': d.estado = 'pendiente'; d.pagadaEn = null; break;
    case 'editar':  return abrir(d);
    case 'eliminar':
      if (!confirm(`¿Eliminar "${d.nombre}"?`)) return;
      deudas = deudas.filter(x => x.id !== id);
      break;
  }
  guardar(); render();
});

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  filtro = b.dataset.f;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

// ===== Recalcular alertas al volver a la app o al cambiar de día =====
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
window.addEventListener('storage', e => { if (e.key === KEY) { deudas = cargar(); render(); } });
let dia = hoyISO();
setInterval(() => { if (hoyISO() !== dia) { dia = hoyISO(); render(); } }, 60000);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
</body>
</html>
